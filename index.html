<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <title>The Villa Card</title>
  </head>
  <body>
    <div class="villa-card">
      <img
        class="villa-image"
        src="anime pictures/sololeveling.jpg"
        alt="Villa"
      />
      <div class="price">
        <strong>$330</strong>
        <span>/ Night</span>
      </div>

      <button class="favorite">
        <i class="fa-regular fa-heart"></i>
      </button>

      <div class="card-content">
        <div class="title-row">
          <h2>See Villa On West Blvd</h2>

          <div class="rating">
            <span>4.8</span>
            <i class="fa-solid fa-star"></i>
          </div>
        </div>

        <div class="location">
          <i class="fa-regular fa-map"></i>
          <span>Ramsar, Mazandaran</span>
        </div>

        <div class="details">
          <div class="detail">
            <i class="fa-solid fa-bed"></i>
            <span>2 Beds</span>
          </div>

          <div class="detail">
            <i class="fa-solid fa-shower"></i>
            <span>3 Baths</span>
          </div>

          <div class="detail">
            <i class="fa-solid fa-expand"></i>
            <span>270 m<sup>2</sup></span>
          </div>
        </div>

        <button class="reserve">Reserve</button>
      </div>
    </div>
  </body>
</html>
