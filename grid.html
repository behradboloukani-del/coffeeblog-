<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="grid" content="width=device-width, initial-scale=1.0" />
    <title>anime grid</title>
    <link rel="stylesheet" href="grid.css" />
  </head>
  <body>
    <div class="container">
      <div class="item">
        <img src="anime pictures/sololeveling.jpg" alt="sololeveling" />
        <p>Solo Leveling</p>
      </div>
      <div class="item">
        <img src="anime pictures/jujutsokaisen.jpg" alt="jujutsokaisen" />
        <p>Jujutso Kaisen</p>
      </div>
      <div class="item">
        <img src="anime pictures/demonslayer.jpg" alt="demonslayer" />
        <p>Demon Slayer</p>
      </div>
      <div class="item">
        <img src="anime pictures/onepiece.jpg" alt="onepiece" />
        <p>Onepiece</p>
      </div>
      <div class="item">
        <img src="anime pictures/tokyorevengers.jpg" alt="tokyorevengers" />
        <p>Tokyo Revengers</p>
      </div>
      <div class="item">
        <img src="anime pictures/myheroacademia.jpg" alt="myheroacademia" />
        <p>My Hero Academia</p>
      </div>
      <div class="item">
        <img src="anime pictures/yourname.jpg" alt="yourname" />
        <p>Your Name</p>
      </div>
      <div class="item">
        <img src="anime pictures/mydressupdarling.jpg" alt="mydressupdarling" />
        <p>My Dress Up Darling</p>
      </div>
      <div class="item">
        <img src="anime pictures/goldentime.jpg" alt="goldentime" />
        <p>Golden Time</p>
      </div>
    </div>
  </body>
</html>
